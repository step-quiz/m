<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor del manifest — Material de matemàtiques</title>
<style>
  :root {
    --bg:        #f5f5f7;
    --surface:   #ffffff;
    --surface-2: #fafafa;
    --surface-3: #f0f0f3;
    --text:      #1d1d1f;
    --text-2:    #6e6e73;
    --text-3:    #aeaeb2;
    --accent:    #0071e3;
    --accent-soft: rgba(0,113,227,.10);
    --green:     #34c759;
    --amber:     #ff9f0a;
    --red:       #ff3b30;
    --divider:   rgba(0,0,0,.08);
    --divider-2: rgba(0,0,0,.04);
    --radius:    14px;
    --radius-sm: 8px;
    --radius-xs: 5px;
    --sh:        0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.05);
    --sh-md:     0 4px 16px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.04);
    --sh-lg:     0 16px 48px rgba(0,0,0,.15);
    --ease:      cubic-bezier(.4,0,.2,1);
    --mono:      ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.45;
  }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ── Topbar ─────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 11px 22px;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--divider);
  }
  .topbar h1 {
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  }
  .topbar h1 .h-sub { color: var(--text-2); font-weight: 500; margin-left: 6px; }
  .topbar .dirty {
    font-size: 11px;
    color: var(--amber);
    background: rgba(255,159,10,.12);
    padding: 3px 8px;
    border-radius: 980px;
    font-weight: 600;
  }
  .topbar .dirty[hidden] { display: none; }
  .topbar .spacer { flex: 1; }
  .topbar a.back { font-size: 12px; color: var(--text-2); text-decoration: none; }
  .topbar a.back:hover { color: var(--text); }

  .btn {
    padding: 7px 14px;
    border-radius: 980px;
    font-size: 12px;
    font-weight: 600;
    transition: background .12s, color .12s, box-shadow .12s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn svg { width: 12px; height: 12px; }
  .btn-prim  { background: var(--accent); color: #fff; box-shadow: var(--sh); }
  .btn-prim:hover { background: #0064cc; }
  .btn-ghost { background: var(--surface-3); color: var(--text-2); }
  .btn-ghost:hover { background: var(--divider); color: var(--text); }
  .btn-danger { background: rgba(255,59,48,.10); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }

  /* ── Layout ─────────────────────────────────────────────────────── */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 22px 22px 80px;
  }

  .panel {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--sh);
    margin-bottom: 16px;
  }
  .panel > summary {
    list-style: none;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    user-select: none;
  }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary svg.caret {
    width: 11px; height: 11px;
    color: var(--text-3);
    transition: transform .15s;
  }
  .panel[open] > summary svg.caret { transform: rotate(90deg); }
  .panel > summary h2 {
    font-size: 14px; font-weight: 700; letter-spacing: -.01em; flex: 1;
  }
  .panel > summary .panel-hint {
    font-size: 11px; color: var(--text-3); font-weight: 500;
  }
  .panel-body {
    padding: 0 18px 18px;
    border-top: 1px solid var(--divider-2);
    padding-top: 14px;
  }

  /* ── Drop zone (when no manifest loaded) ────────────────────────── */
  .drop-zone {
    margin: 22px auto;
    max-width: 720px;
    border: 2px dashed var(--text-3);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 50px 24px;
    text-align: center;
    transition: border-color .15s, background .15s;
  }
  .drop-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .drop-zone h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .drop-zone p { color: var(--text-2); font-size: 13px; margin-bottom: 14px; }
  .drop-zone .dz-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .drop-zone input[type=file] { display: none; }

  /* ── Form rows ──────────────────────────────────────────────────── */
  .row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 10px 14px;
    align-items: start;
    margin-bottom: 10px;
  }
  .row label { font-size: 12px; font-weight: 600; color: var(--text-2); padding-top: 7px; }
  .row label .req { color: var(--red); margin-left: 2px; }
  .row .field { min-width: 0; }
  .row input[type=text],
  .row input[type=number],
  .row input[type=url],
  .row textarea,
  .row select {
    width: 100%;
    padding: 7px 10px;
    background: var(--surface-2);
    border: 1px solid var(--divider);
    border-radius: var(--radius-xs);
    transition: background .12s, border-color .12s, box-shadow .12s;
  }
  .row input:focus, .row textarea:focus, .row select:focus {
    outline: none;
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .row textarea { min-height: 60px; resize: vertical; font-family: inherit; }
  .row .hint { font-size: 11px; color: var(--text-3); margin-top: 3px; }

  /* ── Vocabulary chips ───────────────────────────────────────────── */
  .vocab-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 10px 14px;
    align-items: start;
    padding: 8px 0;
    border-bottom: 1px solid var(--divider-2);
  }
  .vocab-row:last-child { border-bottom: none; }
  .vocab-row > label { font-size: 12px; font-weight: 600; color: var(--text-2); padding-top: 8px; }
  .vocab-row .chips {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  }
  .vchip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 4px 4px 9px;
    background: var(--surface-3);
    border-radius: 980px;
    font-size: 12px;
    color: var(--text);
  }
  .vchip .vchip-label {
    color: var(--text-2);
    font-size: 10px;
    border-left: 1px solid var(--divider);
    padding-left: 6px;
    margin-left: 2px;
  }
  .vchip .vchip-edit, .vchip .vchip-del {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-3);
    transition: background .12s, color .12s;
  }
  .vchip .vchip-edit:hover { background: var(--accent); color: #fff; }
  .vchip .vchip-del:hover  { background: var(--red); color: #fff; }
  .vchip svg { width: 9px; height: 9px; }
  .vchip-add {
    padding: 4px 10px;
    border-radius: 980px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    transition: background .12s;
  }
  .vchip-add:hover { background: var(--accent); color: #fff; }

  /* ── Activity blocks editor ─────────────────────────────────────── */
  .ablk {
    border: 1px solid var(--divider); border-radius: var(--radius-sm);
    background: var(--surface-2); padding: 9px 12px; margin-bottom: 9px;
  }
  .ablk-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .ablk-head .ablk-name { font-size: 12.5px; font-weight: 700; color: var(--text); }
  .ablk-head .ablk-count {
    font-size: 10px; font-weight: 600; color: var(--text-2);
    background: var(--surface-3); border-radius: 980px; padding: 1px 7px;
  }
  .ablk-btn {
    width: 22px; height: 22px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-3); background: var(--surface-3);
    transition: background .12s, color .12s;
  }
  .ablk-btn:first-of-type { margin-left: auto; }
  .ablk-btn:hover { background: var(--accent); color: #fff; }
  .ablk-btn:disabled { opacity: .35; cursor: default; background: var(--surface-3); color: var(--text-3); }
  .ablk-btn-del:hover { background: var(--red); }
  .ablk-btn svg { width: 11px; height: 11px; }
  .ablk-items { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .ablk-empty { font-size: 11px; color: var(--text-3); font-style: italic; }
  .vchip.ablk-chip { padding: 4px 4px 4px 9px; }
  .ablk-rm {
    width: 18px; height: 18px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-3); transition: background .12s, color .12s;
  }
  .ablk-rm:hover { background: var(--red); color: #fff; }
  .ablk-rm svg { width: 9px; height: 9px; }
  .ablk-warn {
    width: 14px; height: 14px; border-radius: 50%; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--amber); color: #fff;
  }
  .ablk-orphans {
    border: 1px solid var(--amber); border-radius: var(--radius-sm);
    background: rgba(255,159,10,.07); padding: 10px 12px; margin-bottom: 12px;
  }
  .ablk-orphans-head {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; color: #92600a; margin-bottom: 6px;
  }
  .ablk-orphans-head svg { width: 15px; height: 15px; flex: none; color: var(--amber); }
  .ablk-orphan-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; flex-wrap: wrap; }
  .ablk-assign {
    font-size: 11px; padding: 3px 7px; border-radius: 6px;
    border: 1px solid var(--divider); background: var(--surface); color: var(--text);
  }
  .ablk-assign:focus { outline: none; border-color: var(--accent); }

  /* ── Files table ────────────────────────────────────────────────── */
  .file-toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .file-toolbar input[type=search] {
    flex: 1;
    max-width: 320px;
    padding: 7px 12px;
    background: var(--surface-2);
    border: 1px solid var(--divider);
    border-radius: 980px;
  }
  .file-toolbar input[type=search]:focus {
    outline: none; background: var(--surface);
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .file-toolbar .count { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .file-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 4px;
  }
  .file-table thead th {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-3);
    padding: 4px 10px;
    text-align: left;
  }
  .file-table tbody tr {
    background: var(--surface-2);
    transition: background .12s;
  }
  .file-table tbody tr:hover { background: var(--surface-3); }
  .file-table tbody td {
    padding: 9px 10px;
    border-top: 1px solid var(--divider);
    border-bottom: 1px solid var(--divider);
    vertical-align: middle;
  }
  .file-table tbody td:first-child {
    border-left: 1px solid var(--divider);
    border-radius: var(--radius-xs) 0 0 var(--radius-xs);
  }
  .file-table tbody td:last-child {
    border-right: 1px solid var(--divider);
    border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
  }
  .file-table .ft-title {
    font-weight: 600;
    color: var(--text);
    max-width: 380px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-table .ft-id {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    margin-top: 2px;
    max-width: 380px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-table .ft-pill {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 980px;
    font-size: 10px;
    font-weight: 600;
    background: var(--surface-3);
    color: var(--text-2);
    margin-right: 3px;
  }
  .file-table .ft-pill.format-pdf { background: rgba(192,57,43,.10); color: #c0392b; }
  .file-table .ft-pill.format-doc { background: rgba(37,99,235,.10); color: #2563eb; }
  .file-table .ft-actions { text-align: right; white-space: nowrap; }
  .file-table .ft-actions button {
    width: 28px; height: 28px;
    border-radius: 6px;
    color: var(--text-2);
    transition: background .12s, color .12s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .file-table .ft-actions button svg { width: 13px; height: 13px; }
  .file-table .ft-actions button:hover { background: var(--surface); color: var(--text); }
  .file-table .ft-actions button.del:hover { background: var(--red); color: #fff; }

  .empty-files {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-2);
    font-size: 13px;
  }

  /* ── Modal ──────────────────────────────────────────────────────── */
  .modal-bg {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fade-in .15s;
  }
  .modal-bg[hidden] { display: none; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--sh-lg);
    width: 100%;
    max-width: 640px;
    max-height: calc(100vh - 48px);
    display: flex; flex-direction: column;
    animation: slide-up .2s var(--ease);
  }
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
  .modal-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .modal-head h2 { font-size: 14px; font-weight: 700; flex: 1; }
  .modal-head .m-close {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface-3);
    color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .modal-head .m-close:hover { background: var(--red); color: #fff; }
  .modal-head .m-close svg { width: 11px; height: 11px; }
  .modal-body { padding: 16px 18px; overflow-y: auto; }
  .modal-foot {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 12px 18px;
    border-top: 1px solid var(--divider);
    background: var(--surface-2);
    border-radius: 0 0 var(--radius) var(--radius);
    flex-shrink: 0;
  }
  .modal-foot .errmsg {
    flex: 1; color: var(--red); font-size: 12px; font-weight: 600;
    align-self: center; text-align: left;
  }

  /* Checkbox/radio cluster */
  .check-cluster {
    display: flex; flex-wrap: wrap; gap: 4px 6px;
    padding: 4px 0;
  }
  .check-cluster label {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px;
    border-radius: 980px;
    background: var(--surface-2);
    border: 1px solid var(--divider);
    font-size: 12px;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .check-cluster label:hover { background: var(--surface-3); }
  .check-cluster input { accent-color: var(--accent); }
  .check-cluster label.is-checked {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 200;
    padding: 10px 18px;
    background: var(--text);
    color: #fff;
    border-radius: 980px;
    font-size: 13px; font-weight: 600;
    box-shadow: var(--sh-lg);
    animation: toast-in .25s var(--ease);
  }
  .toast.is-err { background: var(--red); }
  .toast[hidden] { display: none; }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ── Validation panel ───────────────────────────────────────────── */
  .v-status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600;
  }
  .v-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .v-status.ok   { color: var(--green); } .v-status.ok   .v-dot { background: var(--green); }
  .v-status.warn { color: var(--amber); } .v-status.warn .v-dot { background: var(--amber); }
  .v-status.err  { color: var(--red);   } .v-status.err  .v-dot { background: var(--red);   }

  .v-section + .v-section { margin-top: 16px; }
  .v-section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 8px;
  }
  .v-section-title.err  { color: var(--red);   }
  .v-section-title.warn { color: var(--amber); }

  .v-group {
    border: 1px solid var(--divider); border-radius: var(--radius-sm);
    overflow: hidden; margin-bottom: 8px; background: var(--surface-2);
  }
  .v-group-head {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 9px 12px; text-align: left; cursor: pointer;
    transition: background .12s;
  }
  .v-group-head:hover { background: var(--surface-3); }
  .v-group-title { font-size: 13px; font-weight: 600; }
  .v-group-id    { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .v-group-count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-2); }

  .v-issues { padding: 2px 12px 9px; }
  .v-issue  { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--text-2); padding: 2px 0; }
  .v-issue .v-field { font-family: var(--mono); font-size: 11px; color: var(--text-3); min-width: 76px; flex: none; }
  .v-issue.err  .v-field { color: var(--red);   }
  .v-issue.warn .v-field { color: var(--amber); }

  .v-ok-msg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }

  /* Row badges in the file table */
  .ft-badges { display: inline-flex; gap: 5px; }
  .ft-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; line-height: 1;
    padding: 3px 6px; border-radius: 980px; vertical-align: middle;
  }
  .ft-badge.err  { background: rgba(255,59,48,.12);  color: var(--red); }
  .ft-badge.warn { background: rgba(255,159,10,.16); color: #9a6300;     }
</style>
</head>
<body>

<header class="topbar">
  <h1>Editor de manifest<span class="h-sub">· material de matemàtiques</span></h1>
  <span class="dirty" id="dirty-flag" hidden>● Canvis sense desar</span>
  <div class="spacer"></div>
  <a class="back" href="index.html">← Tornar al cercador</a>
  <button class="btn btn-ghost" id="btn-load">
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8V1M3 4l3-3 3 3M2 9h8v2H2z"/></svg>
    Carrega
  </button>
  <button class="btn btn-prim" id="btn-save">
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 1v8M3 6l3 3 3-3M2 11h8"/></svg>
    Descarrega manifest
  </button>
  <input type="file" id="file-input" accept=".json,application/json" hidden>
</header>

<main class="container" id="container">
  <!-- populated by JS -->
</main>

<div class="modal-bg" id="modal-bg" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Manifest editor — vanilla JS, no dependencies.
   ═══════════════════════════════════════════════════════════════════ */

const FILTER_GROUPS = [
  { key: 'origin',     label: 'Origen',           field: 'origin',     multi: false, required: false },
  { key: 'format',     label: 'Format',           field: 'format',     multi: false, required: true  },
  { key: 'course',     label: 'Curs',             field: 'courses',    multi: true,  required: false },
  { key: 'math_sense', label: 'Sentit matemàtic', field: 'math_sense', multi: false, required: false },
  { key: 'activity',   label: 'Activitat',        field: 'activities', multi: true,  required: false },
  { key: 'type',       label: 'Tipus',            field: 'type',       multi: false, required: false },
];

/* Default empty manifest scaffold */
function emptyManifest() {
  return {
    version: 1,
    generated: new Date().toISOString().slice(0, 10),
    folder_url: '',
    vocabulary: {
      origin: ['miquel-tarradell', 'florence', 'nrich', 'geogebra', 'bogdan', 'fem-matematiques', 'mmaca', 'g-morales', 'ins-gelida', 'reptes-mates'],
      format: ['pdf', 'doc'],
      course: ['1ESO','2ESO','3ESO','4ESO','1Bat','2Bat','ESO','Bat','generic'],
      math_sense: ['algebraic','mesura','espacial','estocastic','numeric','analitic'],
      activity: [],
      type: ['exercici','exercici-solucions','dossier','examen','examen-recuperacio-trimestral','examen-recuperacio-global']
    },
    vocabulary_labels: {},
    activity_blocks: [],
    files: []
  };
}

/* ─── STATE ─────────────────────────────────────────────────────── */
const state = {
  manifest: null,
  dirty: false,
  fileSearch: '',
  editing: null,   // file being edited; null when modal closed
  editingNew: false,
};

const $ = id => document.getElementById(id);

/* ─── HELPERS ───────────────────────────────────────────────────── */
function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function attr(s) { return escHtml(s); }

function label(value) {
  if (!value && value !== 0) return '';
  if (state.manifest?.vocabulary_labels?.[value]) return state.manifest.vocabulary_labels[value];
  return String(value).replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function slugify(s) {
  return String(s)
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 60);
}

function setDirty(flag = true) {
  state.dirty = flag;
  $('dirty-flag').hidden = !flag;
}

function toast(msg, isErr = false, dur = 2200) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('is-err', isErr);
  t.hidden = false;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.hidden = true; }, dur);
}

/* ─── LOAD / SAVE ───────────────────────────────────────────────── */
function loadFromText(text, sourceName) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { toast('JSON invàlid: ' + e.message, true, 4000); return false; }
  if (!data.vocabulary || !Array.isArray(data.files)) {
    toast('Manifest invàlid: falta "vocabulary" o "files"', true, 4000); return false;
  }
  // Ensure every vocab key exists
  for (const G of FILTER_GROUPS) {
    if (!Array.isArray(data.vocabulary[G.key])) data.vocabulary[G.key] = [];
  }
  if (!data.vocabulary_labels || typeof data.vocabulary_labels !== 'object') {
    data.vocabulary_labels = {};
  }
  if (!Array.isArray(data.activity_blocks)) data.activity_blocks = [];
  state.manifest = data;
  state.dirty = false;
  $('dirty-flag').hidden = true;
  render();
  toast(`Manifest carregat (${data.files.length} fitxers)${sourceName ? ' des de ' + sourceName : ''}`);
  // If extreu-json handed off an entry via #new=..., consume it now.
  if (typeof consumePrefilledEntry === 'function') consumePrefilledEntry();
  return true;
}

function loadFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => loadFromText(reader.result, file.name);
  reader.onerror = () => toast('No s\'ha pogut llegir el fitxer', true);
  reader.readAsText(file);
}

function downloadManifest() {
  if (!state.manifest) return;
  // Block on structural errors (duplicate IDs / values outside the vocabulary —
  // those break the search filters). Warnings (incomplete entries) don't block.
  const v = validateManifest();
  if (v.errors.length) {
    const ok = confirm(
      `El manifest té ${v.errors.length} error${v.errors.length === 1 ? '' : 's'} `
      + `que poden trencar els filtres del cercador (IDs duplicats o valors fora del vocabulari).\n\n`
      + `Vols descarregar-lo igualment?`
    );
    if (!ok) return;
  }
  // Stamp generated date
  state.manifest.generated = new Date().toISOString().slice(0, 10);
  const text = JSON.stringify(state.manifest, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'manifest.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  state.dirty = false;
  $('dirty-flag').hidden = true;
  toast('manifest.json descarregat');
}

/* ─── VALIDATION ────────────────────────────────────────────────── */
/* Scans every file against the vocabulary and the required-field rules.
   ERRORS break the search/filters: a duplicate ID, or a tagged value that is
   NOT in vocabulary[...] (that file silently disappears from its facet — the
   typo case). WARNINGS are incomplete-but-usable entries with no course,
   sense, activity or type: exactly the "Eixos" / "Joc de fitxes" situation. */

// field on the file · key in vocabulary · is it a list? · label · required?
const VALIDATION_FIELDS = [
  { field: 'format',     vkey: 'format',     multi: false, label: 'Format',    required: true  },
  { field: 'origin',     vkey: 'origin',     multi: false, label: 'Origen',    required: false },
  { field: 'math_sense', vkey: 'math_sense', multi: false, label: 'Sentit',    required: false },
  { field: 'type',       vkey: 'type',       multi: false, label: 'Tipus',     required: false },
  { field: 'courses',    vkey: 'course',     multi: true,  label: 'Curs',      required: false },
  { field: 'activities', vkey: 'activity',   multi: true,  label: 'Activitat', required: false },
];
// Fields whose absence is only a warning (entry still usable, just less findable).
const COMPLETENESS_WARN = [
  { field: 'courses',    msg: 'Sense curs' },
  { field: 'math_sense', msg: 'Sense sentit matemàtic' },
  { field: 'activities', msg: 'Sense activitat' },
  { field: 'type',       msg: 'Sense tipus' },
];
// Whole-test resources (proves CB) span many senses at once, so a single
// sense/activity doesn't apply — those two warnings are skipped for them.
const WHOLE_TEST_TYPES = new Set(['prova-cb']);

function validateManifest() {
  const empty = { errors: [], warnings: [], all: [], byId: new Map() };
  const m = state.manifest;
  if (!m) return empty;
  const vocab = m.vocabulary || {};
  const inVocab = (vkey, val) => Array.isArray(vocab[vkey]) && vocab[vkey].includes(val);

  // Count IDs across the whole list so duplicates are caught even on import.
  const idCount = new Map();
  for (const f of m.files) {
    const id = f.id || '';
    idCount.set(id, (idCount.get(id) || 0) + 1);
  }

  const issues = [];   // { id, title, level:'error'|'warn', field, msg }
  const push = (f, level, field, msg) =>
    issues.push({ id: f.id || '', title: f.title || '(sense títol)', level, field, msg });

  for (const f of m.files) {
    // Hard-required identity fields. The modal enforces these, but an imported
    // or pre-filled manifest can slip past it.
    if (!f.id)                       push(f, 'error', 'id',       'Sense ID intern');
    else if (idCount.get(f.id) > 1)  push(f, 'error', 'id',       `ID duplicat: "${f.id}"`);
    if (!f.title)                    push(f, 'error', 'title',    'Sense títol');
    if (!f.drive_id && !f.url)       push(f, 'error', 'drive_id', 'Sense Drive ID ni URL (no es podrà obrir)');

    // Every tagged value must exist in the vocabulary, or its filter misses it.
    for (const F of VALIDATION_FIELDS) {
      const raw = f[F.field];
      if (F.multi) {
        for (const v of (raw || [])) {
          if (!inVocab(F.vkey, v)) push(f, 'error', F.field, `${F.label}: "${v}" no és al vocabulari`);
        }
      } else if (raw) {
        if (!inVocab(F.vkey, raw)) push(f, 'error', F.field, `${F.label}: "${raw}" no és al vocabulari`);
      } else if (F.required) {
        push(f, 'error', F.field, `Falta el ${F.label.toLowerCase()}`);
      }
    }

    // Incomplete-but-usable → warning, so the entry stays findable by every facet.
    const wholeTest = WHOLE_TEST_TYPES.has(f.type);
    for (const W of COMPLETENESS_WARN) {
      if (wholeTest && (W.field === 'math_sense' || W.field === 'activities')) continue;
      const raw = f[W.field];
      const isEmpty = Array.isArray(raw) ? raw.length === 0 : !raw;
      if (isEmpty) push(f, 'warn', W.field, W.msg);
    }
  }

  // Manifest-level checks on the activity ↔ activity_blocks relationship.
  // These aren't tied to a single file: they're about the vocabulary/grouping.
  const vocabIssues = [];
  const vpush = (field, msg) => vocabIssues.push({ level: 'warn', field, msg });
  const acts = Array.isArray(vocab.activity) ? vocab.activity : [];
  const blocks = Array.isArray(m.activity_blocks) ? m.activity_blocks : [];
  const blockItems = [];
  for (const b of blocks) for (const it of (b.items || [])) blockItems.push(it);
  const blockSet = new Set(blockItems);
  // (a) activity in the vocabulary but in no block → invisible in the advanced filter
  for (const a of acts) {
    if (!blockSet.has(a)) vpush('activitat', `"${a}" no és a cap bloc → no es podrà filtrar al cercador (mode Avançat)`);
  }
  // (b) a block references an activity that isn't in the vocabulary
  for (const it of new Set(blockItems)) {
    if (!acts.includes(it)) vpush('bloc', `un bloc conté "${it}", que no és al vocabulari d'activitats`);
  }
  // (c) the same activity listed in more than one block
  const seen = {};
  for (const it of blockItems) seen[it] = (seen[it] || 0) + 1;
  for (const it of Object.keys(seen)) {
    if (seen[it] > 1) vpush('bloc', `"${it}" és a ${seen[it]} blocs (sortirà repetida al filtre)`);
  }

  const byId = new Map();
  for (const it of issues) {
    if (!byId.has(it.id)) byId.set(it.id, { error: 0, warn: 0 });
    byId.get(it.id)[it.level === 'error' ? 'error' : 'warn']++;
  }

  return {
    errors:   issues.filter(i => i.level === 'error'),
    warnings: issues.filter(i => i.level === 'warn'),
    all:      issues,
    byId,
    vocabIssues,
  };
}

/* Groups a flat issue list by file, preserving first-seen order. */
function groupIssuesByFile(list) {
  const map = new Map();
  for (const it of list) {
    if (!map.has(it.id)) map.set(it.id, { id: it.id, title: it.title, items: [] });
    map.get(it.id).items.push(it);
  }
  return [...map.values()];
}

/* The report panel rendered at the top of the editor. Re-runs on every render,
   so it always reflects the current state. */
function renderValidationPanel() {
  const v = validateManifest();
  const nE = v.errors.length, nW = v.warnings.length, nV = v.vocabIssues.length;
  const totalW = nW + nV;   // file-level + manifest-level (activity/block) warnings

  let statusClass, statusText;
  if (nE)          { statusClass = 'err';  statusText = `${nE} error${nE === 1 ? '' : 's'}` + (totalW ? ` · ${totalW} avís${totalW === 1 ? '' : 'os'}` : ''); }
  else if (totalW) { statusClass = 'warn'; statusText = `${totalW} avís${totalW === 1 ? '' : 'os'}`; }
  else             { statusClass = 'ok';   statusText = 'Tot correcte'; }

  const open = (nE || totalW) ? ' open' : '';   // expand only when there's something to fix

  let body;
  if (!nE && !totalW) {
    body = `<div class="v-ok-msg">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>
      Cap ID duplicat, cap valor fora del vocabulari, totes les entrades tenen curs, sentit, activitat i tipus, i cada activitat és dins d'un bloc.
    </div>`;
  } else {
    const section = (title, cls, list) => {
      if (!list.length) return '';
      return `
        <div class="v-section">
          <div class="v-section-title ${cls}">${escHtml(title)} · ${list.length}</div>
          ${groupIssuesByFile(list).map(g => `
            <div class="v-group">
              <button class="v-group-head" data-vissue-id="${attr(g.id)}" title="Obre aquesta entrada">
                <span class="v-group-title">${escHtml(g.title)}</span>
                <span class="v-group-id">${escHtml(g.id || '—')}</span>
                <span class="v-group-count">${g.items.length}</span>
              </button>
              <ul class="v-issues">
                ${g.items.map(it => `
                  <li class="v-issue ${it.level === 'error' ? 'err' : 'warn'}">
                    <span class="v-field">${escHtml(it.field)}</span>
                    <span>${escHtml(it.msg)}</span>
                  </li>`).join('')}
              </ul>
            </div>`).join('')}
        </div>`;
    };
    const flatSection = (title, list) => {
      if (!list.length) return '';
      return `
        <div class="v-section">
          <div class="v-section-title warn">${escHtml(title)} · ${list.length}</div>
          <div class="v-group">
            <ul class="v-issues">
              ${list.map(it => `
                <li class="v-issue warn">
                  <span class="v-field">${escHtml(it.field)}</span>
                  <span>${escHtml(it.msg)}</span>
                </li>`).join('')}
            </ul>
          </div>
        </div>`;
    };
    body = section('Errors — trenquen els filtres', 'err', v.errors)
         + section('Avisos — entrades incompletes', 'warn', v.warnings)
         + flatSection('Activitats i blocs', v.vocabIssues);
  }

  return `
    <details class="panel vpanel"${open}>
      <summary>
        <svg class="caret" viewBox="0 0 10 10" fill="currentColor"><path d="M3 1l4 4-4 4z"/></svg>
        <h2>Validació</h2>
        <span class="v-status ${statusClass}"><span class="v-dot"></span>${escHtml(statusText)}</span>
      </summary>
      <div class="panel-body">
        ${body}
      </div>
    </details>
  `;
}

/* ─── RENDER ─────────────────────────────────────────────────────── */
function render() {
  if (!state.manifest) {
    renderDropZone();
    return;
  }
  renderEditor();
}

function renderDropZone() {
  $('container').innerHTML = `
    <div class="drop-zone" id="drop-zone">
      <h2>Editor del manifest</h2>
      <p>
        Carrega un <code>manifest.json</code> existent per editar-lo,
        o comença des d'una plantilla buida amb el vocabulari per defecte.
      </p>
      <div class="dz-row">
        <button class="btn btn-prim"  id="dz-pick">Carrega manifest.json</button>
        <button class="btn btn-ghost" id="dz-new">Comença des de zero</button>
      </div>
      <p style="margin-top:16px;font-size:11px;color:var(--text-3)">
        També pots arrossegar el fitxer aquí.
      </p>
    </div>
  `;
  $('dz-pick').onclick = () => $('file-input').click();
  $('dz-new').onclick = () => {
    state.manifest = emptyManifest();
    setDirty(true);
    render();
    if (typeof consumePrefilledEntry === 'function') consumePrefilledEntry();
  };
}

function renderEditor() {
  const m = state.manifest;
  $('container').innerHTML = `
    ${renderValidationPanel()}
    <details class="panel" open>
      <summary>
        <svg class="caret" viewBox="0 0 10 10" fill="currentColor"><path d="M3 1l4 4-4 4z"/></svg>
        <h2>Configuració general</h2>
        <span class="panel-hint">Versió ${escHtml(m.version)} · generat ${escHtml(m.generated)}</span>
      </summary>
      <div class="panel-body">
        <div class="row">
          <label for="cfg-folder">URL carpeta Drive</label>
          <div class="field">
            <input id="cfg-folder" type="url" value="${attr(m.folder_url || '')}"
                   placeholder="https://drive.google.com/drive/folders/…">
            <div class="hint">Per referència. L'app no llegeix la carpeta; cada fitxer es referencia pel seu <code>drive_id</code>.</div>
          </div>
        </div>
      </div>
    </details>

    <details class="panel">
      <summary>
        <svg class="caret" viewBox="0 0 10 10" fill="currentColor"><path d="M3 1l4 4-4 4z"/></svg>
        <h2>Vocabulari</h2>
        <span class="panel-hint">Valors disponibles per cada categoria d'etiqueta</span>
      </summary>
      <div class="panel-body" id="vocab-body">
        ${FILTER_GROUPS.map(G => renderVocabRow(G)).join('')}
        <div class="hint" style="margin-top:10px">
          Clica una etiqueta per editar el seu nom visible. El × la treu del vocabulari
          (els fitxers que la facin servir mantindran el valor, però sortirà sense format).
        </div>
      </div>
    </details>

    <details class="panel">
      <summary>
        <svg class="caret" viewBox="0 0 10 10" fill="currentColor"><path d="M3 1l4 4-4 4z"/></svg>
        <h2>Blocs d'activitats</h2>
        <span class="panel-hint">Com s'agrupa el filtre d'activitats al cercador</span>
      </summary>
      <div class="panel-body" id="ablocks-body">
        ${renderActivityBlocks()}
      </div>
    </details>

    <details class="panel" open>
      <summary>
        <svg class="caret" viewBox="0 0 10 10" fill="currentColor"><path d="M3 1l4 4-4 4z"/></svg>
        <h2>Fitxers</h2>
        <span class="panel-hint">${m.files.length} ${m.files.length === 1 ? 'fitxer' : 'fitxers'}</span>
      </summary>
      <div class="panel-body">
        <div class="file-toolbar">
          <input id="file-search" type="search" placeholder="Filtra per títol o ID…" value="${attr(state.fileSearch)}">
          <span class="count" id="file-count"></span>
          <button class="btn btn-prim" id="btn-add-file">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2v8M2 6h8"/></svg>
            Afegir fitxer
          </button>
        </div>
        <div id="file-list"></div>
      </div>
    </details>
  `;
  $('cfg-folder').addEventListener('input', e => { m.folder_url = e.target.value; setDirty(); });
  $('file-search').addEventListener('input', e => { state.fileSearch = e.target.value; renderFileList(); });
  $('btn-add-file').onclick = () => openModal(null);
  // Click an issue in the validation panel → jump straight into that entry.
  document.querySelectorAll('[data-vissue-id]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.vissueId;
      const f = state.manifest.files.find(x => (x.id || '') === id);
      if (f) openModal(f);
      else toast('Aquesta entrada no té ID; edita-la des de la llista', true);
    };
  });
  renderFileList();
}

function renderVocabRow(G) {
  const values = state.manifest.vocabulary[G.key] || [];
  const chips = values.map(v => {
    const lbl = state.manifest.vocabulary_labels[v];
    return `
      <span class="vchip" data-vchip-group="${attr(G.key)}" data-vchip-value="${attr(v)}">
        <span class="vchip-value"><code style="font-family:var(--mono);font-size:11px">${escHtml(v)}</code></span>
        ${lbl ? `<span class="vchip-label">${escHtml(lbl)}</span>` : ''}
        <button class="vchip-edit" title="Edita etiqueta visible">
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 8l1.5-.5L8 2l-1-1-5.5 5.5L1 8z"/></svg>
        </button>
        <button class="vchip-del" title="Treu del vocabulari">
          <svg viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l6 6M7 1l-6 6"/></svg>
        </button>
      </span>
    `;
  }).join('');
  return `
    <div class="vocab-row">
      <label>${escHtml(G.label)}</label>
      <div class="chips" data-vocab-group="${attr(G.key)}">
        ${chips}
        <button class="vchip-add" data-vocab-add="${attr(G.key)}">+ nou</button>
      </div>
    </div>
  `;
}

function renderFileList() {
  const m = state.manifest;
  const q = state.fileSearch.trim().toLowerCase();
  const vById = validateManifest().byId;
  const badgeHtml = (id) => {
    const b = vById.get(id || '');
    if (!b || (!b.error && !b.warn)) return '';
    let out = ' <span class="ft-badges">';
    if (b.error) out += `<span class="ft-badge err"  title="${b.error} error${b.error === 1 ? '' : 's'} de validació">▲ ${b.error}</span>`;
    if (b.warn)  out += `<span class="ft-badge warn" title="${b.warn} avís${b.warn === 1 ? '' : 'os'} de validació">● ${b.warn}</span>`;
    return out + '</span>';
  };
  const filtered = m.files.filter(f => {
    if (!q) return true;
    return f.title.toLowerCase().includes(q) || (f.id || '').toLowerCase().includes(q);
  });
  $('file-count').textContent = q
    ? `${filtered.length} de ${m.files.length}`
    : `${m.files.length}`;

  if (!m.files.length) {
    $('file-list').innerHTML = `<div class="empty-files">Cap fitxer encara. Clica <strong>Afegir fitxer</strong> per començar.</div>`;
    return;
  }
  if (!filtered.length) {
    $('file-list').innerHTML = `<div class="empty-files">Cap fitxer coincideix amb la cerca.</div>`;
    return;
  }

  $('file-list').innerHTML = `
    <table class="file-table">
      <thead><tr>
        <th>Títol / ID</th><th>Format</th><th>Curs</th><th>Tipus</th><th></th>
      </tr></thead>
      <tbody>
        ${filtered.map(f => `
          <tr data-file-id="${attr(f.id)}">
            <td>
              <div class="ft-title">${escHtml(f.title || '(sense títol)')}${badgeHtml(f.id)}</div>
              <div class="ft-id">${escHtml(f.id)}</div>
            </td>
            <td><span class="ft-pill format-${attr(f.format || '')}">${escHtml(label(f.format))}</span></td>
            <td>${(f.courses || []).slice(0, 3).map(c => `<span class="ft-pill">${escHtml(label(c))}</span>`).join('')}${(f.courses || []).length > 3 ? `<span class="ft-pill">+${(f.courses.length - 3)}</span>` : ''}</td>
            <td>${f.type ? `<span class="ft-pill">${escHtml(label(f.type))}</span>` : '—'}</td>
            <td class="ft-actions">
              <button class="edit" title="Edita">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 11l1.5-.5L11 2 10 1 1.5 9.5 1 11z"/></svg>
              </button>
              <button class="del" title="Elimina">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4v6a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V4M1 4h10M5 2h2"/></svg>
              </button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

/* ─── VOCAB INTERACTIONS ────────────────────────────────────────── */
function addVocabValue(groupKey) {
  const v = prompt(`Nou valor per "${groupKey}" (ex: probabilitat-bayes):`)?.trim();
  if (!v) return;
  if (!/^[a-z0-9-]+$/.test(v)) {
    toast('Només lletres minúscules, números i guions', true);
    return;
  }
  const list = state.manifest.vocabulary[groupKey];
  if (list.includes(v)) { toast('Aquest valor ja existeix', true); return; }
  list.push(v);
  const lbl = prompt('Etiqueta visible (deixa buit per usar el valor automàtic):')?.trim();
  if (lbl) state.manifest.vocabulary_labels[v] = lbl;
  setDirty();
  render();
}

function editVocabLabel(groupKey, value) {
  const current = state.manifest.vocabulary_labels[value] || '';
  const next = prompt(`Etiqueta visible per "${value}":`, current);
  if (next === null) return;
  if (next.trim()) state.manifest.vocabulary_labels[value] = next.trim();
  else             delete state.manifest.vocabulary_labels[value];
  setDirty();
  render();
}

function removeVocabValue(groupKey, value) {
  const inUse = state.manifest.files.filter(f => {
    const G = FILTER_GROUPS.find(g => g.key === groupKey);
    const v = f[G.field];
    return Array.isArray(v) ? v.includes(value) : v === value;
  });
  if (inUse.length) {
    if (!confirm(`Aquest valor s'usa a ${inUse.length} fitxer(s). Vols treure'l del vocabulari igualment?\n(els fitxers mantindran el valor però es mostrarà sense format)`)) return;
  }
  state.manifest.vocabulary[groupKey] = state.manifest.vocabulary[groupKey].filter(x => x !== value);
  // Keep activity_blocks in sync: a removed activity must also leave any block.
  if (groupKey === 'activity' && Array.isArray(state.manifest.activity_blocks)) {
    for (const b of state.manifest.activity_blocks) b.items = (b.items || []).filter(x => x !== value);
  }
  setDirty();
  render();
}

/* ─── ACTIVITY BLOCKS ───────────────────────────────────────────── */
/* The activity filter in the search UI (advanced mode) is built ONLY from
   activity_blocks[].items. An activity that's in the vocabulary but in no
   block can't be filtered there — this editor is what keeps them in sync. */
function activityBlocks() {
  if (!Array.isArray(state.manifest.activity_blocks)) state.manifest.activity_blocks = [];
  return state.manifest.activity_blocks;
}
function blockedActivitySet() {
  const s = new Set();
  for (const b of activityBlocks()) for (const it of (b.items || [])) s.add(it);
  return s;
}
function orphanActivities() {
  const blocked = blockedActivitySet();
  return (state.manifest.vocabulary.activity || []).filter(v => !blocked.has(v));
}

function addActivityBlock() {
  const name = prompt('Nom del bloc nou (ex: Geometria):')?.trim();
  if (!name) return;
  activityBlocks().push({ label: name, items: [] });
  setDirty();
  render();
}
function renameActivityBlock(i) {
  const b = activityBlocks()[i];
  if (!b) return;
  const next = prompt('Nom del bloc:', b.label);
  if (next === null) return;
  if (!next.trim()) { toast('El nom no pot ser buit', true); return; }
  b.label = next.trim();
  setDirty();
  render();
}
function deleteActivityBlock(i) {
  const b = activityBlocks()[i];
  if (!b) return;
  const n = (b.items || []).length;
  const warn = n ? `\nLes seves ${n} activitat${n === 1 ? '' : 's'} quedaran sense bloc (no filtrables fins que les reassignis).` : '';
  if (!confirm(`Eliminar el bloc "${b.label}"?${warn}`)) return;
  activityBlocks().splice(i, 1);
  setDirty();
  render();
}
function moveActivityBlock(i, dir) {
  const blocks = activityBlocks();
  const j = i + dir;
  if (j < 0 || j >= blocks.length) return;
  [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
  setDirty();
  render();
}
function assignActivityToBlock(value, blockIdx) {
  const blocks = activityBlocks();
  const dest = blocks[blockIdx];
  if (!dest) return;
  // An activity lives in exactly one block: drop it from any other first.
  for (const b of blocks) b.items = (b.items || []).filter(x => x !== value);
  if (!Array.isArray(dest.items)) dest.items = [];
  dest.items.push(value);
  setDirty();
  render();
}
function removeActivityFromBlock(value, blockIdx) {
  const b = activityBlocks()[blockIdx];
  if (!b) return;
  b.items = (b.items || []).filter(x => x !== value);
  setDirty();
  render();
}

const ICON_PENCIL = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 8l1.5-.5L8 2l-1-1-5.5 5.5L1 8z"/></svg>';
const ICON_UP     = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8V2.5M2.5 5L5 2.5 7.5 5"/></svg>';
const ICON_DOWN   = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2v5.5M2.5 5L5 7.5 7.5 5"/></svg>';
const ICON_XBTN   = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg>';
const ICON_XSM    = '<svg viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l6 6M7 1l-6 6"/></svg>';

function renderActivityBlocks() {
  const blocks = activityBlocks();
  const orphans = orphanActivities();

  const orphanBox = orphans.length ? `
    <div class="ablk-orphans">
      <div class="ablk-orphans-head">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5L15 14H1L8 1.5z"/><path d="M8 6.4v3.4M8 11.6v.2"/></svg>
        ${orphans.length} activitat${orphans.length === 1 ? '' : 's'} sense bloc — no ${orphans.length === 1 ? 'apareixerà' : 'apareixeran'} al filtre d'Activitat del cercador
      </div>
      ${orphans.map(v => `
        <div class="ablk-orphan-row">
          <span class="vchip">
            <span class="vchip-value"><code style="font-family:var(--mono);font-size:11px">${escHtml(v)}</code></span>
            <span class="vchip-label">${escHtml(label(v))}</span>
          </span>
          <select class="ablk-assign" data-assign-activity="${attr(v)}">
            <option value="">Assigna a bloc…</option>
            ${blocks.map((b, bi) => `<option value="${bi}">${escHtml(b.label)}</option>`).join('')}
          </select>
        </div>`).join('')}
      ${blocks.length ? '' : `<div class="hint" style="margin-top:8px">Encara no hi ha cap bloc. Crea'n un amb «+ bloc nou» i després assigna-hi les activitats.</div>`}
    </div>` : '';

  const blockList = blocks.map((b, i) => {
    const items = b.items || [];
    const chips = items.length
      ? items.map(v => `
          <span class="vchip ablk-chip">
            <span class="vchip-value"><code style="font-family:var(--mono);font-size:11px">${escHtml(v)}</code></span>
            ${state.manifest.vocabulary.activity.includes(v)
              ? ''
              : '<span class="ablk-warn" title="Aquest valor no és al vocabulari d&#39;activitats">!</span>'}
            <button class="ablk-rm" data-ablk-idx="${i}" data-ablk-val="${attr(v)}" title="Treu d'aquest bloc">${ICON_XSM}</button>
          </span>`).join('')
      : '<span class="ablk-empty">Cap activitat en aquest bloc</span>';
    return `
      <div class="ablk">
        <div class="ablk-head">
          <span class="ablk-name">${escHtml(b.label)}</span>
          <span class="ablk-count">${items.length}</span>
          <button class="ablk-btn" data-ablk-rename="${i}" title="Reanomena el bloc">${ICON_PENCIL}</button>
          <button class="ablk-btn" data-ablk-up="${i}" title="Amunt"${i === 0 ? ' disabled' : ''}>${ICON_UP}</button>
          <button class="ablk-btn" data-ablk-down="${i}" title="Avall"${i === blocks.length - 1 ? ' disabled' : ''}>${ICON_DOWN}</button>
          <button class="ablk-btn ablk-btn-del" data-ablk-del="${i}" title="Elimina el bloc">${ICON_XBTN}</button>
        </div>
        <div class="ablk-items">${chips}</div>
      </div>`;
  }).join('');

  return `
    ${orphanBox}
    ${blockList}
    <button class="btn btn-ghost" data-ablk-add="1" style="margin-top:2px">+ bloc nou</button>
    <div class="hint" style="margin-top:10px">
      Els blocs són com s'agrupa el filtre <strong>Activitat</strong> del cercador (mode Avançat).
      Una activitat que no sigui en cap bloc no s'hi podrà filtrar. Cada activitat va en un sol bloc;
      per moure-la, treu-la del bloc actual (×) i torna a assignar-la des de la llista de dalt.
    </div>`;
}

function readModal() {
  const f = {};
  f.title    = $('f-title').value.trim();
  f.id       = $('f-id').value.trim() || slugify(f.title);
  f.drive_id = $('f-drive').value.trim();
  f.url      = $('f-url').value.trim();
  f.format   = document.querySelector('input[name=f-format]:checked')?.value || '';
  f.origin   = document.querySelector('input[name=f-origin]:checked')?.value || '';
  f.courses  = [...document.querySelectorAll('input[name=f-courses]:checked')].map(x => x.value);
  f.math_sense = document.querySelector('input[name=f-math]:checked')?.value || '';
  f.activities = [...document.querySelectorAll('input[name=f-acts]:checked')].map(x => x.value);
  f.type     = document.querySelector('input[name=f-type]:checked')?.value || '';
  const y = $('f-year').value.trim();
  f.year     = y ? parseInt(y, 10) : null;
  f.notes    = $('f-notes').value.trim();
  return f;
}

function saveModal() {
  const f = readModal();
  const err = $('m-err');
  err.textContent = '';

  if (!f.title) return (err.textContent = 'El títol és obligatori');
  if (!f.id)    return (err.textContent = 'L\'ID intern és obligatori');
  if (!/^[a-z0-9-]+$/.test(f.id)) return (err.textContent = 'L\'ID només pot tenir lletres minúscules, números i guions');
  if (!f.drive_id && !f.url) return (err.textContent = 'Cal un Drive ID o una URL');
  if (!f.format)   return (err.textContent = 'Tria un format');

  // Uniqueness
  const others = state.manifest.files.filter(x => x !== state.editing && x.id === f.id);
  // When editing, state.editing is a clone — find original by reference instead via id
  const origId = state.editingNew ? null : state.editing.id;
  if (!state.editingNew) {
    // same-id okay if it's our original
  }
  const conflict = state.manifest.files.find(x => x.id === f.id && x.id !== origId);
  if (conflict) return (err.textContent = `Ja existeix un fitxer amb ID "${f.id}"`);

  // Clean empty values for tidiness
  if (!f.year) delete f.year;
  if (!f.url) delete f.url;
  if (!f.math_sense) delete f.math_sense;
  if (!f.type) delete f.type;
  if (!f.notes) delete f.notes;
  if (!f.activities.length) delete f.activities;
  if (!f.courses.length) delete f.courses;

  if (state.editingNew) {
    state.manifest.files.push(f);
    toast(`Fitxer "${f.title}" afegit`);
  } else {
    const idx = state.manifest.files.findIndex(x => x.id === origId);
    if (idx >= 0) state.manifest.files[idx] = f;
    toast(`Fitxer "${f.title}" desat`);
  }
  setDirty();
  closeModal();
  render();
}

function deleteEditing() {
  const id = state.editing?.id;
  if (!id) return;
  if (!confirm(`Eliminar el fitxer "${state.editing.title}"?\nNo afecta el fitxer real al Drive, només l'entrada al manifest.`)) return;
  state.manifest.files = state.manifest.files.filter(x => x.id !== id);
  setDirty();
  closeModal();
  render();
  toast('Fitxer eliminat');
}

// Drag-and-drop on the whole page
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  const dz = document.getElementById('drop-zone');
  if (dz) dz.classList.add('dragover');
});
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) {
    const dz = document.getElementById('drop-zone');
    if (dz) dz.classList.remove('dragover');
  }
});
window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  const dz = document.getElementById('drop-zone');
  if (dz) dz.classList.remove('dragover');
  const f = e.dataTransfer?.files?.[0];
  if (f && (f.type === 'application/json' || f.name.endsWith('.json'))) {
    loadFromFile(f);
  } else if (f) {
    toast('Cal un fitxer .json', true);
  }
});

// Delegated clicks on container
document.addEventListener('click', e => {
  // Vocab: add
  const addBtn = e.target.closest('[data-vocab-add]');
  if (addBtn) { addVocabValue(addBtn.dataset.vocabAdd); return; }
  // Vocab: chip edit
  const editVoc = e.target.closest('.vchip .vchip-edit');
  if (editVoc) {
    const chip = editVoc.closest('.vchip');
    editVocabLabel(chip.dataset.vchipGroup, chip.dataset.vchipValue);
    return;
  }
  // Vocab: chip delete
  const delVoc = e.target.closest('.vchip .vchip-del');
  if (delVoc) {
    const chip = delVoc.closest('.vchip');
    removeVocabValue(chip.dataset.vchipGroup, chip.dataset.vchipValue);
    return;
  }
  // Activity blocks: add / rename / move / delete
  if (e.target.closest('[data-ablk-add]')) { addActivityBlock(); return; }
  const abRename = e.target.closest('[data-ablk-rename]');
  if (abRename) { renameActivityBlock(+abRename.dataset.ablkRename); return; }
  const abUp = e.target.closest('[data-ablk-up]');
  if (abUp) { moveActivityBlock(+abUp.dataset.ablkUp, -1); return; }
  const abDown = e.target.closest('[data-ablk-down]');
  if (abDown) { moveActivityBlock(+abDown.dataset.ablkDown, +1); return; }
  const abDel = e.target.closest('[data-ablk-del]');
  if (abDel) { deleteActivityBlock(+abDel.dataset.ablkDel); return; }
  // Activity blocks: remove an item from a block
  const abRm = e.target.closest('.ablk-rm');
  if (abRm) { removeActivityFromBlock(abRm.dataset.ablkVal, +abRm.dataset.ablkIdx); return; }
  // File: edit
  const editRow = e.target.closest('.file-table tbody button.edit');
  if (editRow) {
    const id = editRow.closest('tr').dataset.fileId;
    const f = state.manifest.files.find(x => x.id === id);
    if (f) openModal(f);
    return;
  }
  // File: delete inline
  const delRow = e.target.closest('.file-table tbody button.del');
  if (delRow) {
    const id = delRow.closest('tr').dataset.fileId;
    const f = state.manifest.files.find(x => x.id === id);
    if (!f) return;
    if (!confirm(`Eliminar el fitxer "${f.title}"?\nNo afecta el fitxer real al Drive, només l'entrada al manifest.`)) return;
    state.manifest.files = state.manifest.files.filter(x => x.id !== id);
    setDirty();
    render();
    toast('Fitxer eliminat');
    return;
  }
  // File: row click (anywhere not on action buttons) → edit
  const row = e.target.closest('.file-table tbody tr');
  if (row && !e.target.closest('button')) {
    const id = row.dataset.fileId;
    const f = state.manifest.files.find(x => x.id === id);
    if (f) openModal(f);
    return;
  }
});

// Activity-block assignment via the orphan dropdowns
document.addEventListener('change', e => {
  const sel = e.target.closest('select[data-assign-activity]');
  if (sel && sel.value !== '') {
    assignActivityToBlock(sel.dataset.assignActivity, +sel.value);
  }
});

// Escape closes modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.editing) closeModal();
});

// Prevent accidental nav with unsaved changes
window.addEventListener('beforeunload', e => {
  if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
});

/* ─── INIT ──────────────────────────────────────────────────────── */

// Handoff from extreu-json.html: a URL hash like "#new=<urlencoded JSON>"
// pre-fills the "new file" modal once a manifest is available.
let pendingPrefilledEntry = null;
(function pickUpPrefilledEntry() {
  const m = (location.hash || '').match(/^#new=(.+)$/);
  if (!m) return;
  try {
    pendingPrefilledEntry = JSON.parse(decodeURIComponent(m[1]));
  } catch (e) {
    console.warn('Hash d\'entrada pre-emplenada no vàlid:', e);
  }
  // Clean the URL so reloads don't replay the handoff
  history.replaceState(null, '', location.pathname + location.search);
})();

function consumePrefilledEntry() {
  if (!pendingPrefilledEntry || !state.manifest) return;
  const incoming = pendingPrefilledEntry;
  pendingPrefilledEntry = null;
  // Open as NEW (not edit), merging incoming on top of the default empty entry
  state.editingNew = true;
  state.editing = Object.assign(
    {
      id: '',
      drive_id: '',
      title: '',
      format: 'pdf',
      origin: state.manifest.vocabulary.origin[0] || '',
      courses: [],
      math_sense: '',
      activities: [],
      type: '',
      year: null,
      notes: ''
    },
    incoming
  );
  renderModal();
  $('modal-bg').hidden = false;
  setTimeout(() => $('f-title')?.focus(), 50);
  toast('Entrada pre-emplenada des de extreu-json');
}

// Try to pre-load manifest.json from same dir; if not present, show drop zone
(async function init() {
  try {
    const res = await fetch('manifest.json', { cache: 'no-cache' });
    if (res.ok) {
      const text = await res.text();
      loadFromText(text, 'manifest.json');
      consumePrefilledEntry();
      return;
    }
  } catch {}
  render();  // drop zone
  if (pendingPrefilledEntry) {
    toast('Tens un fitxer per afegir des de extreu-json — carrega o crea primer el manifest', false, 5000);
  }
})();
</script>
