<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repartiment de continguts · ESO 2025-26</title>
<script src="repartiment-data.js"></script>
<!-- Pont cap a Florence i les CB. Només serveix per posar la icona «obre la
     seqüència de pràctica» al costat dels continguts que en tenen; si el
     fitxer no hi és, no surt cap icona i la pàgina funciona igual. -->
<script src="pipeline-data.js"></script>
<script src="common.js"></script>
<style>
:root {
  --navy:   #1f3a5f;
  --blue:   #2e75b6;
  --blue-bg:#eaf1fa;
  --ink:    #22262b;
  --muted:  #5f5e5a;
  --hint:   #8a8a85;
  --line:   #dfe3ea;
  --bg:     #f4f6f9;
  --card:   #ffffff;

  /* sentit palette */
  --s-comprensio:   #506080; --s-comprensio-bg: #ecf0f7; --s-comprensio-bd: #b0bfcf;
  --s-numeric:      #1a6fa8; --s-numeric-bg:    #e8f2fb; --s-numeric-bd:    #8bbfe0;
  --s-espacial:     #1a8a5c; --s-espacial-bg:   #e5f5ed; --s-espacial-bd:   #80ccaa;
  --s-mesura:       #b56010; --s-mesura-bg:     #fdf3e5; --s-mesura-bd:     #e0aa60;
  --s-algebraic:    #6b3fa0; --s-algebraic-bg:  #f2ecfb; --s-algebraic-bd:  #b090d8;
  --s-estocastic:   #a02848; --s-estocastic-bg: #fde8ef; --s-estocastic-bd: #d888a8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 16.5px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Shell ─────────────────────────────────────────────────────────── */
.app { min-height: 100dvh; display: flex; flex-direction: column; }

/* ── Topbar ────────────────────────────────────────────────────────── */
.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px; height: 52px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  z-index: 30;
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 13px; border-radius: 20px;
  border: 1px solid var(--line); font-size: 14.3px; font-weight: 600;
  color: var(--muted); background: var(--card); transition: .12s;
  white-space: nowrap; text-decoration: none;
}
.pill-btn:hover { border-color: var(--navy); color: var(--navy); text-decoration: none; }
.pill-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.pill-btn.accent { border-color: var(--blue); color: var(--blue); }
.pill-btn.accent:hover { background: var(--blue); color: #fff; }
.brand { font-size: 16.5px; font-weight: 800; color: var(--navy); flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-weight: 400; color: var(--muted); font-size: 13.2px; margin-left: 6px; }
/* ── Tabs bar ──────────────────────────────────────────────────────── */
.tabs-bar {
  flex: 0 0 auto;
  display: flex; gap: 0;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 0 12px;
  overflow-x: auto;
}
.tabs-bar::-webkit-scrollbar { height: 0; }
.ctab {
  padding: 11px 18px;
  font-size: 14.85px; font-weight: 600;
  color: var(--muted);
  border-bottom: 2.5px solid transparent;
  cursor: pointer; transition: .12s; white-space: nowrap;
  user-select: none;
}
.ctab:hover { color: var(--navy); }
.ctab.active { color: var(--navy); border-bottom-color: var(--navy); }
.ctab .h-badge {
  font-size: 12.1px; font-weight: 400; color: var(--hint);
  margin-left: 4px;
}

/* ── Main ──────────────────────────────────────────────────────────── */
.main { flex: 1 1 auto; overflow-y: auto; }
.cview { display: none; max-width: 860px; margin: 0 auto; padding: 22px 20px 60px; }
.cview.active { display: block; }

.cview-header {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 20px; padding-bottom: 14px;
  border-bottom: 2px solid var(--line);
}
.cview-header h2 { font-size: 23.1px; color: var(--navy); }
.cview-header .meta { font-size: 13.75px; color: var(--muted); }

/* ── Sentit section ────────────────────────────────────────────────── */
.s-section {
  margin-bottom: 10px;
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--line);
}
.s-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer; user-select: none;
  transition: filter .1s;
}
.s-header:hover { filter: brightness(.97); }
.s-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.s-label { font-size: 12.65px; text-transform: uppercase; letter-spacing: .07em; font-weight: 800; flex: 1; }
.s-hores { font-size: 13.2px; font-weight: 700; opacity: .7; }
.s-chevron { font-size: 11px; color: rgba(0,0,0,.35); transition: transform .15s; margin-left: 4px; }
.s-section.open .s-chevron { transform: rotate(90deg); }

.s-body { background: var(--card); display: none; }
.s-section.open .s-body { display: block; }

/* ── Tema table ─────────────────────────────────────────────────────── */
.tema-table { width: 100%; border-collapse: collapse; }
.tema-table colgroup col:first-child { width: auto; }
.tema-table colgroup col:last-child  { width: 56px; }

.tema-table thead th {
  text-align: left; font-size: 12.1px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; color: var(--hint);
  padding: 7px 14px 5px; border-bottom: 1px solid var(--line);
}
.tema-table thead th:last-child { text-align: right; }
.tema-row td {
  padding: 9px 14px; border-bottom: 1px solid #eef1f4;
  vertical-align: top;
}
.tema-row:last-child td { border-bottom: none; }
.tema-row:hover td { background: #f6f8fb; }

.tema-toggle {
  display: flex; align-items: flex-start; gap: 8px;
  cursor: pointer; user-select: none;
}
.tema-caret {
  font-size: 9px; color: var(--hint); margin-top: 4px;
  flex-shrink: 0; transition: transform .12s;
}
.tema-toggle.open .tema-caret { transform: rotate(90deg); }
.tema-name { font-size: 15.4px; font-weight: 600; color: var(--ink); line-height: 1.35; }

/* Quants continguts del tema tenen seqüència de pràctica. Permet veure on
   n'hi ha sense desplegar tema per tema; la mateixa pastilla que fa servir
   florence-cb.html al seu arbre. */
.tema-pipes {
  flex-shrink: 0; margin-left: auto; align-self: center;
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
  padding: 1px 7px; border-radius: 9px;
  background: var(--blue); color: #fff;
}
.tema-pipes.zero {
  background: transparent; color: var(--hint);
  border: 1px solid var(--line); font-weight: 600;
}

.hores-td { font-size: 14.3px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; padding-top: 10px; }

/* ── Continguts list ───────────────────────────────────────────────── */
.cont-list { display: none; margin-top: 8px; padding-left: 4px; }
.cont-list.open { display: block; }
.cont-list li {
  position: relative;
  font-size: 13.75px; color: var(--muted);
  padding: 2px 0 2px 22px; /* left gutter for bullet / icon */
  line-height: 1.4;
  list-style: none; display: flex; gap: 7px;
}
.cont-list li::before {
  content: '';
  position: absolute; left: 8px; top: 6px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--hint);
}
.cont-list li.has-mat::before { display: none; }
.cont-num { color: var(--hint); font-size: 12.1px; flex-shrink: 0; margin-top: 1px; }

/* Icona "veure material al catàleg" a l'esquerra d'un contingut (injectada per JS) */
.cont-mat {
  position: absolute; left: 1px; top: 2px;
  display: inline-flex; align-items: center;
  flex-shrink: 0;
  color: var(--blue); text-decoration: none;
  border-radius: 5px; padding: 1px 2px;
  transition: background .12s, color .12s;
}
.cont-mat svg { width: 13px; height: 13px; display: block; }
.cont-mat:hover { background: var(--blue-bg); }

/* Icona "obre la seqüència de pràctica", a la DRETA del contingut.
   Les dues icones d'una fila responen preguntes diferents: la de l'esquerra
   diu quin material hi ha, aquesta diu què fer-hi (tasca de Florence +
   preguntes CB). Per això va a l'altra banda i no comparteix el marge. */
.cont-pipe {
  margin-left: auto; align-self: flex-start; margin-top: 1px;
  display: inline-flex; align-items: center; flex-shrink: 0;
  color: var(--blue); opacity: .8; text-decoration: none;
  border-radius: 5px; padding: 1px 3px;
  transition: opacity .12s, background .12s, color .12s;
}
.cont-pipe svg { width: 14px; height: 14px; display: block; }
.cont-list li:hover .cont-pipe { opacity: 1; }
.cont-pipe:hover, .cont-pipe:focus-visible {
  opacity: 1; background: var(--blue-bg); color: var(--blue);
}

/* ── Sentit themes (header BG + dot color + border) ────────────────── */
.s-header.comprensio { background: var(--s-comprensio-bg); }
.s-header.comprensio .s-dot   { background: var(--s-comprensio); }
.s-header.comprensio .s-label { color: var(--s-comprensio); }
.s-section.comprensio { border-color: var(--s-comprensio-bd); }

.s-header.numeric    { background: var(--s-numeric-bg); }
.s-header.numeric    .s-dot   { background: var(--s-numeric); }
.s-header.numeric    .s-label { color: var(--s-numeric); }
.s-section.numeric   { border-color: var(--s-numeric-bd); }

.s-header.espacial   { background: var(--s-espacial-bg); }
.s-header.espacial   .s-dot   { background: var(--s-espacial); }
.s-header.espacial   .s-label { color: var(--s-espacial); }
.s-section.espacial  { border-color: var(--s-espacial-bd); }

.s-header.mesura     { background: var(--s-mesura-bg); }
.s-header.mesura     .s-dot   { background: var(--s-mesura); }
.s-header.mesura     .s-label { color: var(--s-mesura); }
.s-section.mesura    { border-color: var(--s-mesura-bd); }

.s-header.algebraic  { background: var(--s-algebraic-bg); }
.s-header.algebraic  .s-dot   { background: var(--s-algebraic); }
.s-header.algebraic  .s-label { color: var(--s-algebraic); }
.s-section.algebraic { border-color: var(--s-algebraic-bd); }

.s-header.estocastic { background: var(--s-estocastic-bg); }
.s-header.estocastic .s-dot   { background: var(--s-estocastic); }
.s-header.estocastic .s-label { color: var(--s-estocastic); }
.s-section.estocastic{ border-color: var(--s-estocastic-bd); }

/* ── Print ───────────────────────────────────────────────────────────── */
@media print {
  .topbar, .tabs-bar, .pill-btn { display: none !important; }
  .cview { padding: 0; }
  .s-body { display: block !important; }
  .cont-list { display: block !important; }
  .s-section { break-inside: avoid; margin-bottom: 16px; }
}

/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .brand small { display: none; }
  .cview { padding: 14px 12px 50px; }
}

/* ── MODE EDICIÓ ─────────────────────────────────────────────────────── */
.edit-banner {
  flex: 0 0 auto;
  display: none; align-items: center; gap: 10px;
  padding: 8px 16px; font-size: 14px; font-weight: 600; color: #7a6010;
  background: #fff8e0; border-bottom: 2px solid #e8c840;
}
body.is-editing .edit-banner { display: flex; }
.edit-banner-note { font-weight: 400; font-size: 13px; color: #a07820; }
/* show/hide topbar buttons by mode */
.pill-btn.edit-stop,
.pill-btn.edit-dl { display: none; }
body.is-editing .pill-btn.edit-start { display: none; }
body.is-editing .pill-btn.edit-stop  { display: inline-flex; border-color: #c0392b; color: #c0392b; }
body.is-editing .pill-btn.edit-stop:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
body.is-editing .pill-btn.edit-dl    { display: inline-flex; background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
body.is-editing .pill-btn.edit-dl:hover { background: var(--blue); color: #fff; }
/* edit text inputs */
.edit-tema-head {
  display: flex; align-items: center; gap: 8px; width: 100%; cursor: default;
}
.tema-label-inp {
  flex: 1; min-width: 60px; padding: 2px 4px; font-family: inherit;
  font-size: 15.4px; font-weight: 600; color: var(--ink);
  border: none; border-bottom: 1.5px solid var(--blue); background: transparent;
}
.tema-label-inp:focus { outline: none; border-bottom-color: var(--navy); }
.cont-inp {
  flex: 1; min-width: 0; padding: 3px 7px; font-family: inherit;
  font-size: 13.75px; color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; background: #fff;
}
.cont-inp:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(46,117,182,.15); }
.hores-inp {
  width: 46px; padding: 2px 5px; text-align: right; font-family: inherit;
  font-size: 13.5px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; background: #fff;
}
.hores-inp:focus { outline: none; border-color: var(--blue); }
/* action buttons */
.edit-mini-btns { display: flex; gap: 3px; flex-shrink: 0; }
.edit-mini-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; padding: 0; border-radius: 5px; flex-shrink: 0;
  font-size: 11px; color: var(--muted); border: 1px solid var(--line); background: var(--card);
  cursor: pointer; transition: .1s; font-family: inherit;
}
.edit-mini-btn:hover:not([disabled]) { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
.edit-mini-btn.del:hover:not([disabled]) { border-color: #c0392b; color: #c0392b; background: #fde8ef; }
.edit-mini-btn.move:hover:not([disabled]) { border-color: #b56010; color: #b56010; background: #fdf3e5; }
.edit-mini-btn[disabled] { opacity: .3; cursor: default; }
.edit-add-btn {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 7px;
  padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: 600;
  color: var(--blue); border: 1.5px dashed #8bbfe0;
  background: transparent; cursor: pointer; transition: .12s; font-family: inherit;
}
.edit-add-btn:hover { background: var(--blue-bg); }
.edit-cont-row {
  display: flex; align-items: center; gap: 6px; width: 100%; padding: 2px 0;
}
/* move modal */
.move-modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center; z-index: 200;
}
.move-modal-bg[hidden] { display: none; }
.move-modal {
  background: #fff; border-radius: 14px; padding: 22px 26px;
  min-width: 300px; max-width: 90vw; box-shadow: 0 12px 40px rgba(0,0,0,.18);
}
.move-modal h3 { font-size: 16px; color: var(--navy); margin-bottom: 4px; }
.move-modal .move-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.move-modal label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 5px; }
.move-modal select {
  width: 100%; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 7px; font: inherit; font-size: 14.5px; background: #fff; color: var(--ink);
}
.move-modal select:focus { outline: none; border-color: var(--blue); }
.move-modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
@media print {
  .edit-banner, .pill-btn.edit-start, .pill-btn.edit-stop, .pill-btn.edit-dl { display: none !important; }
  /* Un enllaç no serveix de res en paper, i com que va a la dreta desapareix
     sense deixar forat (a diferència de .cont-mat, que ocupa el lloc del punt). */
  .cont-pipe { display: none !important; }
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="pill-btn" href="index.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 4l-5 4 5 4"/></svg>
      Inici
    </a>
    <div class="brand">Repartiment de continguts <small>ESO · 2025-26</small></div>
    <a class="pill-btn accent" data-seguiment-doc href="https://docs.google.com/document/d/POSA-AQUI-EL-TEU-DOC-ID/edit" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M5 8.5l2 2 4-4"/></svg>
      Seguiment
    </a>
    <button class="pill-btn" onclick="window.print()" title="Imprimeix">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="6" rx="1"/><path d="M5 7V3.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5V7M5 13v-2h6v2"/></svg>
      Imprimir
    </button>
    <button class="pill-btn edit-start" id="btn-edit-start" title="Activar mode edició">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 2.6l2.8 2.8M11.8 1.4a1.4 1.4 0 0 1 2 2L5 12.2 1.6 13l.8-3.4z"/></svg>
      Edició
    </button>
    <button class="pill-btn edit-dl" id="btn-edit-dl" title="Descarrega el fitxer modificat">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M5 7l3 3 3-3"/><path d="M3 13h10"/></svg>
      Descarrega repartiment-data.js
    </button>
    <button class="pill-btn edit-stop" id="btn-edit-stop" title="Sortir del mode edició">
      ✕ Sortir d'edició
    </button>
  </header>

  <div class="edit-banner">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0"><path d="M10.6 2.6l2.8 2.8M11.8 1.4a1.4 1.4 0 0 1 2 2L5 12.2 1.6 13l.8-3.4z"/></svg>
    Mode edició actiu
    <span class="edit-banner-note">— Els canvis s'aplicaran quan descarregueu el fitxer i el pugeu al repo.</span>
  </div>

  <div class="tabs-bar" id="tabsBar"></div>
  <main class="main" id="main"></main>

</div><!-- /.app -->

<!-- Modal: moure tema a un altre curs/sentit -->
<div class="move-modal-bg" id="move-modal-bg" hidden>
  <div class="move-modal">
    <h3>Mou tema a…</h3>
    <div id="move-modal-body"></div>
    <div class="move-modal-btns">
      <button class="pill-btn" id="move-cancel-btn">Cancel·la</button>
      <button class="pill-btn accent" id="move-confirm-btn">Mou</button>
    </div>
  </div>
</div>

<script>
/* ─── CONFIG ──────────────────────────────────────────────────────── */
const CURS_ORDER  = ['1ESO', '2ESO', '3ESO', '4ESO'];
const CURS_LABELS = { '1ESO':'1r ESO', '2ESO':'2n ESO', '3ESO':'3r ESO', '4ESO':'4t ESO' };

/* ─── STATE ───────────────────────────────────────────────────────── */
let activeCurs = '1ESO';

/* ─── RENDER ──────────────────────────────────────────────────────── */

function renderTabs() {
  document.getElementById('tabsBar').innerHTML = CURS_ORDER.map(c => {
    const d = REPARTIMENT[c];
    return `<div class="ctab${c===activeCurs?' active':''}" data-curs="${c}">
      ${escHtml(CURS_LABELS[c])}
      <span class="h-badge">${d.hores_any}h</span>
    </div>`;
  }).join('');
}

function renderMain() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  for (const curs of CURS_ORDER) {
    main.appendChild(buildCursView(curs));
  }
}

function buildCursView(curs) {
  const d = REPARTIMENT[curs];
  const div = document.createElement('div');
  div.className = 'cview' + (curs === activeCurs ? ' active' : '');
  div.id = 'cv-' + curs;

  let html = `<div class="cview-header">
    <h2>${escHtml(d.label)}</h2>
    <span class="meta">${d.hores_any}h anuals &mdash; ${escHtml(d.hores_info)}</span>
  </div>`;

  for (const bloc of d.blocs) {
    const sm = SENTITS[bloc.sentit];
    const sid = `${curs}__${bloc.sentit}`;
    html += `<div class="s-section ${bloc.sentit}" id="ss-${sid}">
      <div class="s-header ${bloc.sentit}" data-sid="${sid}">
        <div class="s-dot"></div>
        <div class="s-label">${escHtml(sm.label)}</div>
        <div class="s-hores">${bloc.hores}h</div>
        <span class="s-chevron">▶</span>
      </div>
      <div class="s-body">
        <table class="tema-table">
          <colgroup><col/><col/></colgroup>
          <thead><tr><th>Tema</th><th style="text-align:right">Hores</th></tr></thead>
          <tbody>
          ${bloc.temes.map(t => buildTemaRow(curs, bloc.sentit, t)).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  div.innerHTML = html;
  return div;
}

function buildTemaRow(curs, sentit, t) {
  const rid = `${curs}__${sentit}__${t.id}`;
  const linkMap = (typeof CONTINGUTS_ACTIVITATS !== 'undefined' ? CONTINGUTS_ACTIVITATS : {})[`${sentit}/${t.id}`] || {};
  const items = t.continguts.map((c, i) => {
    const acts = linkMap[i + 1] || [];
    const da = acts.length ? ` data-act="${escHtml(acts.join(','))}"` : '';
    return `<li${da}><span class="cont-num">${i+1}.</span><span>${escHtml(c)}</span>`
      + pipelineLink(curs, sentit, t.id, i + 1) + `</li>`;
  }).join('');
  return `<tr class="tema-row">
    <td>
      <div class="tema-toggle" data-rid="${rid}">
        <span class="tema-caret">▶</span>
        <span class="tema-name">${escHtml(t.label)}</span>
        ${pipelineCount(curs, sentit, t)}
      </div>
      <ul class="cont-list" id="cl-${rid}">${items}</ul>
    </td>
    <td class="hores-td">${t.hores}h</td>
  </tr>`;
}

/* ─── ACTIONS ─────────────────────────────────────────────────────── */

function switchCurs(curs) {
  activeCurs = curs;
  document.querySelectorAll('.ctab').forEach(t =>
    t.classList.toggle('active', t.dataset.curs === curs));
  document.querySelectorAll('.cview').forEach(v =>
    v.classList.toggle('active', v.id === 'cv-' + curs));
}

function toggleSection(sid) {
  const sec = document.getElementById('ss-' + sid);
  sec.classList.toggle('open');
}

function toggleTema(rid) {
  const tog = document.querySelector(`.tema-toggle[data-rid="${rid}"]`);
  const list = document.getElementById('cl-' + rid);
  const open = tog.classList.toggle('open');
  list.classList.toggle('open', open);
}

/* ─── EVENTS ──────────────────────────────────────────────────────── */

document.getElementById('tabsBar').addEventListener('click', e => {
  const tab = e.target.closest('.ctab');
  if (tab) switchCurs(tab.dataset.curs);
});

document.getElementById('main').addEventListener('click', e => {
  // Edit mode: intercept action buttons before anything else
  if (isEditing && handleEditClick(e)) return;

  // Section header toggle (ignore clicks on inputs / buttons)
  const hdr = e.target.closest('.s-header');
  if (hdr && !e.target.closest('input, button')) { toggleSection(hdr.dataset.sid); return; }

  // Tema expand/collapse (read mode only — in edit mode continguts are always visible)
  if (!isEditing) {
    const tog = e.target.closest('.tema-toggle');
    if (tog) { toggleTema(tog.dataset.rid); }
  }
});

document.getElementById('main').addEventListener('input', e => {
  if (isEditing) handleEditInput(e);
});

/* ─── ENLLAÇOS AL CATÀLEG ─────────────────────────────────────────────
 * Per a cada contingut amb activitats mapades (data-act), mira si el
 * catàleg (manifest.json) té materials d'aquelles activitats i, si en té,
 * hi posa una icona que obre el cercador filtrat. Si el manifest no es pot
 * carregar (p. ex. obrint amb file://), no apareix cap icona i la pàgina
 * continua funcionant igual. */
function applyMaterialLinks(manifest) {
  const byAct = {};
  for (const f of (manifest.files || [])) {
    for (const a of (f.activities || [])) {
      (byAct[a] = byAct[a] || new Set()).add(f.id);
    }
  }
  document.querySelectorAll('#main li[data-act]').forEach(li => {
    const acts = li.dataset.act.split(',').filter(Boolean);
    const ids = new Set();
    acts.forEach(a => { if (byAct[a]) byAct[a].forEach(id => ids.add(id)); });
    const n = ids.size;
    if (!n) return;                       // cap material al catàleg → cap icona
    const qs = new URLSearchParams({ mode: 'advanced', activity: acts.join(',') });
    const url = 'index.html?' + qs.toString();
    const lbl = `${n} ${n === 1 ? 'material' : 'materials'} al catàleg · obre el cercador filtrat`;
    li.classList.add('has-mat');
    li.insertAdjacentHTML('afterbegin',
      `<a class="cont-mat" href="${url}" target="_blank" rel="noopener" title="${escHtml(lbl)}" aria-label="${escHtml(lbl)}">`
      + `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">`
      + `<path d="M4 2.5h4.5L12.5 6.5v6a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M8.5 2.5v4h4"/></svg>`
      + `</a>`);
  });
}

/* ─── ENLLAÇ A LA SEQÜÈNCIA DE PRÀCTICA ───────────────────────────────
 * El camí invers del que fa florence-cb.html: des d'un contingut concret
 * del repartiment, obrir-hi directament la seqüència (tasca rica de
 * Florence → preguntes CB → material). El pont són PIPELINES i
 * CONTINGUT_PIPELINE, de pipeline-data.js.
 *
 * A diferència de les icones del catàleg, aquesta es pinta al mateix
 * moment de construir la fila: les dades són locals i síncrones, no cal
 * esperar cap fetch. Si pipeline-data.js no s'ha carregat, o el contingut
 * no té res associat, no es retorna res i la fila queda com abans. */
/* Pastilla «n/m» a la capçalera del tema: quants dels seus continguts tenen
   seqüència. Es dedueix del mateix pont, així que apareix i desapareix sola. */
function pipelineCount(curs, sentit, t) {
  if (typeof CONTINGUT_PIPELINE === 'undefined') return '';
  const m = CONTINGUT_PIPELINE[`${curs}|${sentit}/${t.id}`] || {};
  const tot = t.continguts.length;
  const amb = t.continguts.filter((c, i) => (m[i + 1] || []).length).length;
  const lbl = amb
    ? `${amb} ${amb === 1 ? "d'aquests continguts té" : "d'aquests continguts tenen"} seqüència de pràctica (tasca de Florence i preguntes CB)`
    : 'Cap contingut d\'aquest tema no té encara seqüència de pràctica';
  return `<span class="tema-pipes${amb ? '' : ' zero'}" title="${escHtml(lbl)}">${amb}/${tot}</span>`;
}

function pipelineLink(curs, sentit, tid, pos) {
  if (typeof CONTINGUT_PIPELINE === 'undefined' || typeof PIPELINES === 'undefined') return '';
  const fils = (((CONTINGUT_PIPELINE[`${curs}|${sentit}/${tid}`] || {})[pos]) || [])
    .map(id => PIPELINES[id]).filter(Boolean);
  if (!fils.length) return '';

  // Comptem sessions i preguntes sense repetir: dos fils poden compartir-ne.
  const sess = new Set(), cb = new Set();
  for (const f of fils) {
    (f.florence || []).forEach(([sid]) => sess.add(sid));
    (f.cb || []).forEach(id => cb.add(id));
  }
  const trossos = [];
  if (sess.size) trossos.push(sess.size === 1 ? 'una tasca de Florence' : `${sess.size} tasques de Florence`);
  if (cb.size)   trossos.push(cb.size === 1 ? 'una pregunta CB' : `${cb.size} preguntes CB`);
  const lbl = `${fils.map(f => f.label).join(' · ')} — ${trossos.join(' i ')}`
            + ' · obre la seqüència de pràctica';

  const url = 'florence-cb.html?c=' + encodeURIComponent(`${curs}|${sentit}/${tid}|${pos}`);
  return `<a class="cont-pipe" href="${url}" target="_blank" rel="noopener"`
    + ` title="${escHtml(lbl)}" aria-label="${escHtml(lbl)}">`
    + `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"`
    + ` stroke-linecap="round" stroke-linejoin="round">`
    + `<circle cx="3.6" cy="8" r="1.9"/><circle cx="12.4" cy="8" r="1.9"/><path d="M5.5 8h5"/></svg>`
    + `</a>`;
}

/* ═══════════════════════════════════════════════════════════════════
   MODE EDICIÓ — estat, operacions, renderització i descàrrega
   ═══════════════════════════════════════════════════════════════════ */

/* ─── Estat ───────────────────────────────────────────────────────── */
let editData = null;   // còpia mutable de REPARTIMENT durant l'edició
let isEditing = false;
let _movePending = null; // { curs, sentit, tid } mentre el modal està obert

/* ─── Start / stop ────────────────────────────────────────────────── */
function startEdit() {
  editData = JSON.parse(JSON.stringify(REPARTIMENT));
  isEditing = true;
  document.body.classList.add('is-editing');
  renderMainEdit();
}

function stopEdit() {
  const dirty = JSON.stringify(editData) !== JSON.stringify(REPARTIMENT);
  if (dirty && !confirm('Hi ha canvis que no heu descarregat. Sortir igualment?')) return;
  editData = null;
  isEditing = false;
  document.body.classList.remove('is-editing');
  renderMain();
  REPARTIMENT[activeCurs].blocs.forEach(b =>
    document.getElementById(`ss-${activeCurs}__${b.sentit}`)?.classList.add('open'));
  fetch('manifest.json').then(r => r.ok ? r.json() : null)
    .then(m => { if (m) applyMaterialLinks(m); }).catch(() => {});
}

/* ─── Helpers d'accés ─────────────────────────────────────────────── */
function eBloc(curs, sentit) {
  return editData[curs]?.blocs.find(b => b.sentit === sentit) || null;
}
function eTema(curs, sentit, tid) {
  return eBloc(curs, sentit)?.temes.find(t => t.id === tid) || null;
}

/* ─── Operacions sobre continguts ────────────────────────────────── */
function eCont_Move(curs, sentit, tid, ci, dir) {
  const t = eTema(curs, sentit, tid); if (!t) return;
  const ni = ci + dir;
  if (ni < 0 || ni >= t.continguts.length) return;
  [t.continguts[ci], t.continguts[ni]] = [t.continguts[ni], t.continguts[ci]];
  rerenderCurs(curs);
}
function eCont_Del(curs, sentit, tid, ci) {
  const t = eTema(curs, sentit, tid); if (!t) return;
  if (!confirm(`Suprimir "${t.continguts[ci]}"?`)) return;
  t.continguts.splice(ci, 1);
  rerenderCurs(curs);
}
function eCont_Add(curs, sentit, tid) {
  const t = eTema(curs, sentit, tid); if (!t) return;
  t.continguts.push('Nou contingut');
  rerenderCurs(curs);
}
// Actualitza el text d'un contingut sense re-renderitzar (l'input ja mostra el valor)
function eCont_Update(curs, sentit, tid, ci, value) {
  const t = eTema(curs, sentit, tid);
  if (t) t.continguts[ci] = value;
}

/* ─── Operacions sobre temes ──────────────────────────────────────── */
function eTema_Move(curs, sentit, tid, dir) {
  const bloc = eBloc(curs, sentit); if (!bloc) return;
  const i = bloc.temes.findIndex(t => t.id === tid);
  const ni = i + dir;
  if (ni < 0 || ni >= bloc.temes.length) return;
  [bloc.temes[i], bloc.temes[ni]] = [bloc.temes[ni], bloc.temes[i]];
  rerenderCurs(curs);
}
function eTema_Del(curs, sentit, tid) {
  const bloc = eBloc(curs, sentit); if (!bloc) return;
  const i = bloc.temes.findIndex(t => t.id === tid); if (i < 0) return;
  if (!confirm(`Suprimir el tema "${bloc.temes[i].label}" i tots els seus continguts?`)) return;
  bloc.temes.splice(i, 1);
  rerenderCurs(curs);
}
function eTema_Add(curs, sentit) {
  const bloc = eBloc(curs, sentit); if (!bloc) return;
  bloc.temes.push({ id: 'tema-' + Date.now(), label: 'Tema nou', hores: 0, continguts: ['Contingut 1'] });
  rerenderCurs(curs);
}
function eTema_UpdateLabel(curs, sentit, tid, value) {
  const t = eTema(curs, sentit, tid); if (t) t.label = value;
}
function eTema_UpdateHores(curs, sentit, tid, value) {
  const t = eTema(curs, sentit, tid); if (t) t.hores = parseInt(value) || 0;
}
function eTema_MoveTo(srcCurs, srcSentit, tid, dstCurs, dstSentit) {
  if (srcCurs === dstCurs && srcSentit === dstSentit) return;
  const srcBloc = eBloc(srcCurs, srcSentit);
  const dstBloc = eBloc(dstCurs, dstSentit);
  if (!dstBloc) { alert(`No existeix el sentit "${dstSentit}" a ${dstCurs}.`); return; }
  const i = srcBloc.temes.findIndex(t => t.id === tid); if (i < 0) return;
  const [tema] = srcBloc.temes.splice(i, 1);
  dstBloc.temes.push(tema);
  rerenderCurs(srcCurs);
  if (dstCurs !== srcCurs) rerenderCurs(dstCurs);
}

/* ─── Operació sobre blocs ────────────────────────────────────────── */
function eBloc_UpdateHores(curs, sentit, value) {
  const b = eBloc(curs, sentit); if (b) b.hores = parseInt(value) || 0;
}

/* ─── Re-renderitzar un curs (preservant la pestanya activa) ──────── */
function rerenderCurs(curs) {
  const el = document.getElementById('cv-' + curs); if (!el) return;
  const newEl = buildCursViewEdit(curs);
  newEl.className = el.className;
  el.replaceWith(newEl);
  // En mode edició deixa tots els blocs oberts
  editData[curs].blocs.forEach(b =>
    document.getElementById(`ss-${curs}__${b.sentit}`)?.classList.add('open'));
}

/* ─── Render principal (mode edició) ──────────────────────────────── */
function renderMainEdit() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  for (const curs of CURS_ORDER) main.appendChild(buildCursViewEdit(curs));
  // Obre tots els blocs del curs actiu per defecte
  editData[activeCurs].blocs.forEach(b =>
    document.getElementById(`ss-${activeCurs}__${b.sentit}`)?.classList.add('open'));
}

function buildCursViewEdit(curs) {
  const d = editData[curs];
  const div = document.createElement('div');
  div.className = 'cview' + (curs === activeCurs ? ' active' : '');
  div.id = 'cv-' + curs;

  let html = `<div class="cview-header">
    <h2>${escHtml(d.label)}</h2>
    <span class="meta">${d.hores_any}h anuals &mdash; ${escHtml(d.hores_info)}</span>
  </div>`;

  for (const bloc of d.blocs) {
    const sm = SENTITS[bloc.sentit];
    const sid = `${curs}__${bloc.sentit}`;
    html += `
    <div class="s-section ${escHtml(bloc.sentit)}" id="ss-${sid}">
      <div class="s-header ${escHtml(bloc.sentit)}" data-sid="${sid}">
        <div class="s-dot"></div>
        <div class="s-label">${escHtml(sm.label)}</div>
        <input class="hores-inp" type="number" min="0" max="999" value="${bloc.hores}"
          data-edit="bloc-hores" data-curs="${escHtml(curs)}" data-sentit="${escHtml(bloc.sentit)}"
          title="Hores del bloc">
        <span style="font-size:12px;color:var(--muted);margin-right:4px">h</span>
        <span class="s-chevron">▶</span>
      </div>
      <div class="s-body">
        <table class="tema-table">
          <colgroup><col/><col style="width:82px"/></colgroup>
          <thead><tr><th>Tema</th><th style="text-align:right">Hores</th></tr></thead>
          <tbody>
          ${bloc.temes.map((t, ti) => buildTemaRowEdit(curs, bloc.sentit, t, ti, bloc.temes.length)).join('')}
          </tbody>
        </table>
        <button class="edit-add-btn"
          data-edit="add-tema" data-curs="${escHtml(curs)}" data-sentit="${escHtml(bloc.sentit)}">
          + Afegir tema
        </button>
      </div>
    </div>`;
  }
  div.innerHTML = html;
  return div;
}

function buildTemaRowEdit(curs, sentit, t, ti, total) {
  const rid = `${escHtml(curs)}__${escHtml(sentit)}__${escHtml(t.id)}`;
  const first = ti === 0, last = ti === total - 1;

  const contItems = t.continguts.map((c, ci) => `
    <li>
      <div class="edit-cont-row">
        <span class="cont-num">${ci + 1}.</span>
        <input class="cont-inp" type="text" value="${escHtml(c)}"
          data-edit="cont" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
          data-tid="${escHtml(t.id)}" data-ci="${ci}">
        <div class="edit-mini-btns">
          <button class="edit-mini-btn" title="Amunt"
            data-edit="cont-up" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
            data-tid="${escHtml(t.id)}" data-ci="${ci}" ${ci === 0 ? 'disabled' : ''}>▲</button>
          <button class="edit-mini-btn" title="Avall"
            data-edit="cont-down" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
            data-tid="${escHtml(t.id)}" data-ci="${ci}" ${ci === t.continguts.length - 1 ? 'disabled' : ''}>▼</button>
          <button class="edit-mini-btn del" title="Suprimeix contingut"
            data-edit="cont-del" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
            data-tid="${escHtml(t.id)}" data-ci="${ci}">✕</button>
        </div>
      </div>
    </li>`).join('');

  return `
  <tr class="tema-row">
    <td>
      <div class="edit-tema-head">
        <span class="tema-caret">▶</span>
        <input class="tema-label-inp" type="text" value="${escHtml(t.label)}"
          data-edit="tema-label" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
          data-tid="${escHtml(t.id)}">
        <div class="edit-mini-btns">
          <button class="edit-mini-btn" title="Amunt dins del bloc"
            data-edit="tema-up" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
            data-tid="${escHtml(t.id)}" ${first ? 'disabled' : ''}>▲</button>
          <button class="edit-mini-btn" title="Avall dins del bloc"
            data-edit="tema-down" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
            data-tid="${escHtml(t.id)}" ${last ? 'disabled' : ''}>▼</button>
          <button class="edit-mini-btn move" title="Mou a un altre curs o sentit"
            data-edit="tema-move" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
            data-tid="${escHtml(t.id)}">↔</button>
          <button class="edit-mini-btn del" title="Suprimeix tema"
            data-edit="tema-del" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
            data-tid="${escHtml(t.id)}">✕</button>
        </div>
      </div>
      <ul class="cont-list open" id="cl-${rid}">
        ${contItems}
        <li style="list-style:none">
          <button class="edit-add-btn"
            data-edit="add-cont" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
            data-tid="${escHtml(t.id)}">+ Afegir contingut</button>
        </li>
      </ul>
    </td>
    <td class="hores-td" style="vertical-align:top;padding-top:9px">
      <input class="hores-inp" type="number" min="0" max="999" value="${t.hores}"
        data-edit="tema-hores" data-curs="${escHtml(curs)}" data-sentit="${escHtml(sentit)}"
        data-tid="${escHtml(t.id)}">h
    </td>
  </tr>`;
}

/* ─── Dispatch de clics en mode edició ────────────────────────────── */
function handleEditClick(e) {
  const btn = e.target.closest('[data-edit]'); if (!btn) return false;
  const { edit: act, curs, sentit, tid, ci } = btn.dataset;
  const idx = parseInt(ci ?? '0');
  switch (act) {
    case 'cont-up':   eCont_Move(curs, sentit, tid, idx, -1); break;
    case 'cont-down': eCont_Move(curs, sentit, tid, idx, +1); break;
    case 'cont-del':  eCont_Del(curs, sentit, tid, idx);      break;
    case 'add-cont':  eCont_Add(curs, sentit, tid);           break;
    case 'tema-up':   eTema_Move(curs, sentit, tid, -1);      break;
    case 'tema-down': eTema_Move(curs, sentit, tid, +1);      break;
    case 'tema-del':  eTema_Del(curs, sentit, tid);           break;
    case 'add-tema':  eTema_Add(curs, sentit);                break;
    case 'tema-move': openMoveModal(curs, sentit, tid);       break;
    default: return false;
  }
  return true;
}

/* ─── Dispatch d'inputs en mode edició ────────────────────────────── */
function handleEditInput(e) {
  const el = e.target; if (!el.dataset.edit) return;
  const { edit: act, curs, sentit, tid, ci } = el.dataset;
  switch (act) {
    case 'cont':       eCont_Update(curs, sentit, tid, parseInt(ci), el.value); break;
    case 'tema-label': eTema_UpdateLabel(curs, sentit, tid, el.value);          break;
    case 'tema-hores': eTema_UpdateHores(curs, sentit, tid, el.value);          break;
    case 'bloc-hores': eBloc_UpdateHores(curs, sentit, el.value);               break;
  }
}

/* ─── Modal: moure tema ───────────────────────────────────────────── */
function openMoveModal(curs, sentit, tid) {
  const tema = eTema(curs, sentit, tid); if (!tema) return;
  _movePending = { curs, sentit, tid };
  const cursOpts = CURS_ORDER.map(c =>
    `<option value="${c}"${c===curs?' selected':''}>${escHtml(CURS_LABELS[c])}</option>`).join('');
  const sentitOpts = Object.entries(SENTITS).map(([k, v]) =>
    `<option value="${k}"${k===sentit?' selected':''}>${escHtml(v.label)}</option>`).join('');
  document.getElementById('move-modal-body').innerHTML = `
    <p class="move-sub">Tema: <strong>${escHtml(tema.label)}</strong></p>
    <label>Curs destí</label>
    <select id="move-dst-curs">${cursOpts}</select>
    <label>Sentit destí</label>
    <select id="move-dst-sentit">${sentitOpts}</select>`;
  document.getElementById('move-modal-bg').hidden = false;
}
function closeMoveModal(confirmed) {
  if (confirmed && _movePending) {
    eTema_MoveTo(
      _movePending.curs, _movePending.sentit, _movePending.tid,
      document.getElementById('move-dst-curs').value,
      document.getElementById('move-dst-sentit').value
    );
  }
  document.getElementById('move-modal-bg').hidden = true;
  _movePending = null;
}

/* ─── Descàrrega de repartiment-data.js ────────────────────────────
 *
 * L'ÚNICA cosa que aquest editor canvia és REPARTIMENT. Per tant el fitxer
 * NO es regenera de zero: es baixa el text original i s'hi substitueix
 * únicament el bloc de REPARTIMENT, deixant la resta byte a byte igual.
 *
 * Abans es reconstruïa tot amb JSON.stringify(), i això s'emportava per
 * davant el bloc de documentació de CONTINGUTS_ACTIVITATS (format de la
 * clau, com afegir-n'hi, l'avís sobre les posicions) i els comentaris de
 * línia que expliquen a quin contingut correspon cada número. Un sol ús de
 * l'editor i la documentació del fitxer desapareixia.
 *
 * Delimitadors del bloc: la línia «const REPARTIMENT = {» i la línia
 * «}; // end REPARTIMENT». Si no s'hi troben (o no es pot llegir el fitxer),
 * s'avisa i no es descarrega res, en comptes de generar un fitxer mutilat. */
async function downloadData() {
  let original;
  try {
    const res = await fetch('repartiment-data.js', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    original = await res.text();
  } catch (err) {
    alert("No s'ha pogut llegir repartiment-data.js per actualitzar-lo.\n\n"
      + "Cal servir la pàgina per HTTP(S), no obrir-la amb file://.\n"
      + "No s'ha descarregat res (error: " + err.message + ").");
    return;
  }

  const START = /^const REPARTIMENT = \{$/m;
  const END   = /^\}; \/\/ end REPARTIMENT$/m;
  const mStart = START.exec(original);
  const mEnd   = mStart ? END.exec(original.slice(mStart.index)) : null;
  if (!mStart || !mEnd) {
    alert("No s'han trobat els delimitadors del bloc REPARTIMENT dins de\n"
      + "repartiment-data.js, així que no s'ha tocat res.\n\n"
      + "El bloc ha de començar amb «const REPARTIMENT = {» i acabar amb\n"
      + "«}; // end REPARTIMENT», cadascun sol a la seva línia.");
    return;
  }
  const from = mStart.index;
  const to   = mStart.index + mEnd.index + mEnd[0].length;

  const date = new Date().toLocaleDateString('ca-ES', {day:'2-digit',month:'2-digit',year:'numeric'});
  const block = `const REPARTIMENT = ${JSON.stringify(editData, null, 2)}; // end REPARTIMENT`
    + `\n/* Bloc REPARTIMENT actualitzat per l'editor de repartiment.html el ${date}.`
    + `\n * Si hi heu reordenat, afegit o esborrat continguts d'algun tema, reviseu les`
    + `\n * DUES taules que hi apunten per posició:`
    + `\n *   · CONTINGUTS_ACTIVITATS, al final d'aquest fitxer (enllaç al catàleg);`
    + `\n *   · CONTINGUT_PIPELINE, a pipeline-data.js (enllaç a Florence i a les CB).`
    + `\n * Cap de les dues no peta si la posició ja no existeix: simplement deixa`
    + `\n * d'aparèixer l'enllaç d'aquell contingut. */`;

  const js = original.slice(0, from) + block + original.slice(to);

  const blob = new Blob([js], { type: 'application/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'repartiment-data.js';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ─── Wire-up dels botons d'edició ───────────────────────────────── */
document.getElementById('btn-edit-start').onclick  = startEdit;
document.getElementById('btn-edit-stop').onclick   = stopEdit;
document.getElementById('btn-edit-dl').onclick     = downloadData;
document.getElementById('move-confirm-btn').onclick = () => closeMoveModal(true);
document.getElementById('move-cancel-btn').onclick  = () => closeMoveModal(false);
document.getElementById('move-modal-bg').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeMoveModal(false);
});
renderTabs();
renderMain();
// Open all sentit sections of the active course by default
REPARTIMENT[activeCurs].blocs.forEach(b =>
  document.getElementById(`ss-${activeCurs}__${b.sentit}`)?.classList.add('open'));

// Enllaços al catàleg (best-effort): carrega el manifest i posa les icones.
fetch('manifest.json').then(r => r.ok ? r.json() : null).then(m => { if (m) applyMaterialLinks(m); }).catch(() => {});
</script>
